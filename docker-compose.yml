services:
  mysql:
    image: mysql:8.0
    container_name: smart_cafeteria_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smart_cafeteria
    ports:
      - "3307:3306" # host:container — 3307 avoids clashing with XAMPP if it's still installed
    volumes:
      - cafeteria_db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d # schema.sql + seed.sql run automatically on first start

volumes:
  cafeteria_db_data:
