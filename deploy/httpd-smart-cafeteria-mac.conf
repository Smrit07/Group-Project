# ===========================================================================
# Smart Cafeteria & Resource Queue Optimizer — Apache configuration for XAMPP (macOS)
# ===========================================================================
#
# What this does
# --------------
# Apache serves the built Svelte PWA on port 80 and forwards two paths to the
# Node process on port 4000:
#
#     http://localhost/smart-cafeteria/            -> frontend/dist (static files)
#     http://localhost/smart-cafeteria/api/...     -> Node   (REST API)
#     http://localhost/smart-cafeteria/socket.io/  -> Node   (WebSocket, live updates)
#
# Why a proxy rather than just running Node on 4000 and opening that directly:
# the browser then sees one origin for the page, the API and the socket, so
# there is no CORS involved, no mixed-content warning if the college ever puts
# a certificate on Apache, and one URL to give the module tutor. It is also the
# arrangement the report describes — Apache and MySQL from XAMPP, Node behind
# them.
#
# Note on what XAMPP can and cannot do here
# -----------------------------------------
# XAMPP is Apache + MySQL + PHP. It cannot execute a Node or Python program, so
# it does not "run" the backend or the DES engine — those are two separate
# processes, started by deploy/start-smart-cafeteria.bat. What XAMPP provides
# is the MySQL database and the web server in front of everything. This is
# exactly what Section 2.2.3 of the proposal and Section 6 of the final report
# describe ("MySQL hosted via XAMPP during development").
#
# ---------------------------------------------------------------------------
# Installation
# ---------------------------------------------------------------------------
# 1. Copy this file to:
#        /Applications/XAMPP/xamppfiles/etc/extra/httpd-smart-cafeteria.conf
#    (create the "extra" folder if it does not already exist)
#
# 2. Open                 /Applications/XAMPP/xamppfiles/etc/httpd.conf
#    and make sure these four modules are NOT commented out (remove the
#    leading "#" if present). The first three are usually already enabled on a
#    standard XAMPP install; proxy_wstunnel usually is not, and without it the
#    live queue updates fall back to slow polling.
#
#        LoadModule proxy_module modules/mod_proxy.so
#        LoadModule proxy_http_module modules/mod_proxy_http.so
#        LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
#        LoadModule rewrite_module modules/mod_rewrite.so
#        LoadModule headers_module modules/mod_headers.so
#
# 3. At the very bottom of httpd.conf, add:
#
#        Include conf/extra/httpd-smart-cafeteria.conf
#
# 4. Restart Apache: open the XAMPP Manager (Manager-osx.app, usually in
#    /Applications/XAMPP), Stop then Start Apache — or from a terminal:
#        sudo /Applications/XAMPP/xamppfiles/xampp restartapache
#
# 5. Build the frontend and copy it into place:
#
#        cd frontend
#        npm run build
#        cp -r dist /Applications/XAMPP/xamppfiles/htdocs/smart-cafeteria
#
#    (deploy/start-smart-cafeteria.sh does not do this step for you — the
#     frontend build and copy are separate, since XAMPP's htdocs location
#     needs sudo on some Mac installs. Run the two commands above by hand.)
# ===========================================================================

# ---------------------------------------------------------------------------
# Order matters: the two ProxyPass rules must come BEFORE the Alias.
# Apache evaluates them in order, and if the Alias wins first, /api requests
# are served as missing static files and every call returns 404 with an HTML
# body — which shows up in the browser as "Unexpected token '<' in JSON".
# ---------------------------------------------------------------------------

# The REST API.
ProxyPass        /smart-cafeteria/api  http://127.0.0.1:4000/api
ProxyPassReverse /smart-cafeteria/api  http://127.0.0.1:4000/api

# Socket.io. This needs two rules: the ws:// one for the upgraded WebSocket
# connection and the http:// one for the initial handshake and for the polling
# fallback. With only the http:// rule, the connection is established and then
# dies on upgrade, which presents as live updates working for a few seconds
# after every page load and then stopping.
ProxyPass        /smart-cafeteria/socket.io  ws://127.0.0.1:4000/socket.io
ProxyPassReverse /smart-cafeteria/socket.io  ws://127.0.0.1:4000/socket.io
<LocationMatch "^/smart-cafeteria/socket\.io">
    ProxyPass        http://127.0.0.1:4000/socket.io
    ProxyPassReverse http://127.0.0.1:4000/socket.io
</LocationMatch>

# Pass the real client address through. Without this every request in the Node
# log appears to come from 127.0.0.1, because as far as Node is concerned it
# does.
RequestHeader set X-Forwarded-Proto "http"

# The DES engine is deliberately NOT proxied. It has no authentication of its
# own and is bound to 127.0.0.1; only the Node backend should be able to reach
# it, and the backend is what enforces the manager/admin role check on
# /api/simulations. Exposing it through Apache would let anyone on the campus
# network run simulations directly.

# ---------------------------------------------------------------------------
# The built PWA
# ---------------------------------------------------------------------------
Alias /smart-cafeteria "/Applications/XAMPP/xamppfiles/htdocs/smart-cafeteria"

<Directory "/Applications/XAMPP/xamppfiles/htdocs/smart-cafeteria">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted

    # --- SPA routing ------------------------------------------------------
    # The app is a single page: there is no index.html in a /profile folder,
    # because there is no /profile folder. Anything that is not a real file is
    # handed to index.html so the client-side view logic can deal with it.
    # Without this, refreshing the page on any view other than the home screen
    # gives a 404 — a bug that only appears after deployment, never in dev.
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /smart-cafeteria/

        # Leave the proxied paths alone.
        RewriteCond %{REQUEST_URI} !^/smart-cafeteria/api
        RewriteCond %{REQUEST_URI} !^/smart-cafeteria/socket\.io
        # Only rewrite if the target is genuinely not on disk.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /smart-cafeteria/index.html [L]
    </IfModule>

    # --- Caching ----------------------------------------------------------
    <IfModule mod_headers.c>
        # Vite content-hashes asset filenames, so a cached copy can never be
        # stale: a changed file gets a different name. Cache them hard.
        <FilesMatch "\.[0-9a-zA-Z]{8,}\.(js|css|woff2?)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>

        # index.html and the service worker must never be cached, or a rebuild
        # never reaches a browser that has already installed the PWA — the
        # classic "I deployed the fix but it still shows the old version".
        <FilesMatch "^(index\.html|sw\.js|manifest\.webmanifest)$">
            Header set Cache-Control "no-cache, no-store, must-revalidate"
        </FilesMatch>
    </IfModule>

    # The manifest needs the right MIME type or Chrome ignores it and the app
    # silently stops being installable (NFR-01).
    <IfModule mod_mime.c>
        AddType application/manifest+json .webmanifest
    </IfModule>

    # --- Compression ------------------------------------------------------
    # The JS bundle is ~110 kB uncompressed and ~36 kB gzipped. On the low-end
    # Android phones named in Section 6 of the report, that difference is
    # noticeable on the college wifi.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json application/manifest+json image/svg+xml
    </IfModule>
</Directory>
